name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run source contracts
        run: npm test
      - name: Parse every PowerShell file
        shell: pwsh
        run: |
          $errors = [System.Collections.Generic.List[object]]::new()
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors
            )
            foreach ($parseError in $parseErrors) { $errors.Add($parseError) }
          }
          if ($errors.Count) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Run PowerShell behavioral tests
        shell: pwsh
        run: |
          ./windows/Test-SiolaCore.ps1
          ./windows/Test-SiolaGoogleSheets.ps1
